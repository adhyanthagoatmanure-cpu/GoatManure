# Local MySQL for development. Set DB_NAME, DB_USER, DB_PASSWORD, and
# MYSQL_ROOT_PASSWORD in .env before starting the container.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - adhyantha_mysql_data:/var/lib/mysql

volumes:
  adhyantha_mysql_data:
